name: Publish Chang-e report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout report
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify report and prepare static files
        run: python3 .github/scripts/stage_report.py
      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
